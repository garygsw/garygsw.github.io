{% if site.enable_tooltips %}
<!-- Enable Tooltips -->
<script type="text/javascript">
$(function () {$('[data-toggle="tooltip"]').tooltip()})
</script>
{% endif %}

{% if site.enable_medium_zoom %}
<!-- Medium Zoom JS -->
<script src="https://cdn.jsdelivr.net/npm/medium-zoom@{{ site.medium_zoom.version }}/dist/medium-zoom.min.js" integrity="{{ site.medium_zoom.integrity }}" crossorigin="anonymous"></script>
<script src="{{ '/assets/js/zoom.js' | relative_url }}"></script>
{% endif %}

<!-- Publication citation / attention badges -->
{% if site.enable_publication_badges.altmetric %}
<script async src="https://d1bxh8uas1mnw7.cloudfront.net/assets/embed.js"></script>
{% endif %}
{% if site.enable_publication_badges.dimensions %}
<script async src="https://badge.dimensions.ai/badge.js" charset="utf-8"></script>
{% endif %}

<!-- Load headroom -->
<script src="{{ '/assets/js/headroom.min.js' | relative_url }}"></script>

<!-- Load Common JS -->
<script src="{{ '/assets/js/common.js' | relative_url }}"></script>

<!-- Code copy button -->
<script src="{{ '/assets/js/clipboard.js' | relative_url }}"></script>
<script src="{{ '/assets/js/copy_code.js' | relative_url }}"></script>

<!-- Charts / diagrams / pseudocode (opt-in per page via front matter) -->
{% include scripts/diagrams.html %}
