<!--
  Rich-content renderers, loaded only on pages that opt in via front matter:
    chart_js: true    -> Chart.js          (<canvas> + new Chart(...))
    plotly: true      -> Plotly.js         (<div> + Plotly.newPlot(...))
    mermaid: true     -> Mermaid diagrams   (<div class="mermaid">...)
    pseudocode: true  -> pseudocode.js      (<pre class="pseudocode">...)  [needs KaTeX]
    tikzjax: true     -> TikZJax            (<script type="text/tikz">...)
-->
{% if page.chart_js %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
{% endif %}

{% if page.plotly %}
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
{% endif %}

{% if page.mermaid %}
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({
    startOnLoad: true,
    theme: document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "default",
  });
</script>
{% endif %}

{% if page.pseudocode %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pseudocode@2.4.1/build/pseudocode.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/pseudocode@2.4.1/build/pseudocode.min.js"></script>
<script>
  window.addEventListener("load", function () {
    if (window.pseudocode) {
      pseudocode.renderClass("pseudocode", { lineNumber: true });
    }
  });
</script>
{% endif %}

{% if page.tikzjax %}
<link rel="stylesheet" href="https://tikzjax.com/v1/fonts.css">
<script src="https://tikzjax.com/v1/tikzjax.js"></script>
{% endif %}
