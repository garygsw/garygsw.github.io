name: Update Google Scholar citations

on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  workflow_dispatch: # allow manual runs

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch citation counts
        run: python bin/update_scholar_citations.py

      - name: Commit updated citations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/citations.yml
          if git diff --staged --quiet; then
            echo "No citation changes."
          else
            git commit -m "chore: update Google Scholar citations"
            git push
          fi
